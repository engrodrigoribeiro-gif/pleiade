<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Visualizador de documento</title>
  <style>
    html,body{height:100%;margin:0;background:#eef4f1;color:#173d34;font-family:Arial,sans-serif}
    body{display:grid;grid-template-rows:auto 1fr}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;background:#fff;border-bottom:1px solid #d7e4df}
    h1{font-size:16px;margin:0}.actions{display:flex;gap:10px}a{color:#176b5b;font-weight:700;text-decoration:none}
    iframe{width:100%;height:100%;border:0;background:#fff}.error{padding:24px}
  </style>
</head>
<body>
  <header><h1 id="title">Documento de titularidade</h1><div class="actions"><a id="open" target="_blank" rel="noopener">Abrir PDF</a><a id="download" download>Download</a></div></header>
  <main id="main"></main>
  <script>
    (function(){
      var file=new URLSearchParams(location.search).get('file')||'';
      var valid=/^documents\/titularidade\/[A-Za-z0-9._-]+\.pdf$/i.test(file);
      var main=document.getElementById('main');
      if(!valid){main.className='error';main.textContent='Documento inválido ou não informado.';return;}
      document.getElementById('title').textContent=file.split('/').pop().replace(/_/g,' ').replace(/\.pdf$/i,'');
      document.getElementById('open').href=file;
      document.getElementById('download').href=file;
      var frame=document.createElement('iframe');frame.src=file;frame.title='Visualização do documento PDF';main.appendChild(frame);
    })();
  </script>
</body>
</html>
